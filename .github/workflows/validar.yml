name: Validar Recetario
on:
  push:
    branches: [main, feature/ampliacion-recetas-lote-1, integracion/recetario-cierre-2026-10-28]
  pull_request:
    branches: [main, feature/buscador-gratuito-real, feature/premium-inventario-cantidades]
  workflow_dispatch:
jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-package-lock --no-audit --no-fund
      - run: npm run test:unit
      - run: npm run build
